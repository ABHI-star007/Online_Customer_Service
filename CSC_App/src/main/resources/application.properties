spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/CSC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root1234}
# small pool: free DBs cap connections and the instance has little RAM
spring.datasource.hikari.maximum-pool-size=3

#ORM s/w specific properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Render injects PORT
server.port=${PORT:8080}

# comma separated list of frontend origins allowed to call the API
app.cors.allowed-origins=${CORS_ORIGINS:*}

