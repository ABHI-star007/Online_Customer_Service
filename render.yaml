services:
  - type: web
    name: ocsc-api
    runtime: docker
    plan: free
    rootDir: CSC_App
    dockerfilePath: ./Dockerfile
    # No DB_URL: the container starts its own MariaDB (data resets on restart).
    # Set DB_URL/DB_USERNAME/DB_PASSWORD to use an external MySQL instead.
    envVars:
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: ocsc-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: grep -rl 'http://localhost:8080' . | xargs sed -i "s#http://localhost:8080#${API_URL}#g"
    staticPublishPath: .
    envVars:
      - key: API_URL
        sync: false
